
[functions.create-user]
enabled = true
verify_jwt = true
import_map = "./functions/create-user/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/create-user/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/create-user/*.html" ]

[functions.lookup-membership]
enabled = true
verify_jwt = true
import_map = "./functions/lookup-membership/deno.json"
entrypoint = "./functions/lookup-membership/index.ts"
[functions.process-nominations-open]
enabled = true
# Custom auth inside the function (admin JWT or service role / cron secret).
verify_jwt = false
import_map = "./functions/process-nominations-open/deno.json"
entrypoint = "./functions/process-nominations-open/index.ts"

[functions.send-web-push]
enabled = true
verify_jwt = true
import_map = "./functions/send-web-push/deno.json"
entrypoint = "./functions/send-web-push/index.ts"
